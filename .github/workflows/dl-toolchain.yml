
name: Export Go toolchains

# MANUAL ONLY.
# No push, pull_request or schedule triggers.
on:
  workflow_dispatch:
    inputs:
      start_ver:
        description: "First Go minor version (e.g. 1.21)"
        required: true
        type: string
        default: "1.21"

      end_ver:
        description: "Last Go minor version (e.g. 1.27)"
        required: true
        type: string
        default: "1.27"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      START_VER: ${{ inputs.start_ver }}
      END_VER: ${{ inputs.end_ver }}

    steps:
      # No checkout or Go installation required.

      - name: Download official Go distributions
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          start_raw = os.environ["START_VER"]
          end_raw = os.environ["END_VER"]

          def parse_minor(value):
              match = re.fullmatch(r"1\.(\d+)", value)

              if not match:
                  raise ValueError(
                      f"Invalid Go minor version: {value}"
                  )

              minor = int(match.group(1))

              if minor < 21:
                  raise ValueError(
                      "Minimum supported version is 1.21"
                  )

              return minor

          start = parse_minor(start_raw)
          end = parse_minor(end_raw)

          if start > end:
              raise ValueError(
                  "start_ver must not exceed end_ver"
              )

          # Official Go release metadata.
          #
          # include=all returns historical releases,
          # not only the latest supported versions.
          url = "https://go.dev/dl/?mode=json&include=all"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "go-toolchain-exporter"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=120
          ) as response:
              releases = json.load(response)

          # Latest stable release for each Go minor.
          # Patch numbers are compared numerically.
          selected = {}

          for release in releases:
              if not release.get("stable", False):
                  continue

              version = release.get("version", "")

              match = re.fullmatch(
                  r"go1\.(\d+)(?:\.(\d+))?",
                  version
              )

              if not match:
                  continue

              minor = int(match.group(1))
              patch = int(match.group(2) or 0)

              if minor < start or minor > end:
                  continue

              files = {
                  item["filename"]: item
                  for item in release.get("files", [])
              }

              linux_name = (
                  f"{version}.linux-amd64.tar.gz"
              )

              windows_name = (
                  f"{version}.windows-amd64.zip"
              )

              # Both distributions must exist.
              if (
                  linux_name not in files
                  or windows_name not in files
              ):
                  continue

              previous = selected.get(minor)

              if (
                  previous is None
                  or patch > previous["patch"]
              ):
                  selected[minor] = {
                      "patch": patch,
                      "version": version,
                      "files": [
                          files[linux_name],
                          files[windows_name],
                      ],
                  }

          missing = [
              f"1.{minor}"
              for minor in range(start, end + 1)
              if minor not in selected
          ]

          if missing:
              raise RuntimeError(
                  "No complete stable release for: "
                  + ", ".join(missing)
              )

          out = Path("dist")
          out.mkdir(parents=True, exist_ok=True)

          manifest = []
          checksums = []

          for minor in range(start, end + 1):
              release = selected[minor]
              version = release["version"]

              print(
                  f"SELECT: {version}",
                  flush=True
              )

              for item in release["files"]:
                  filename = item["filename"]
                  expected = item["sha256"].lower()
                  expected_size = item.get("size")

                  download_url = (
                      f"https://go.dev/dl/{filename}"
                  )

                  destination = out / filename

                  print(
                      f"DOWNLOAD: {filename}",
                      flush=True
                  )

                  request = urllib.request.Request(
                      download_url,
                      headers={
                          "User-Agent": (
                              "go-toolchain-exporter"
                          )
                      }
                  )

                  sha256 = hashlib.sha256()
                  size = 0

                  # Stream to disk without loading
                  # multi-hundred-MB archives into RAM.
                  with urllib.request.urlopen(
                      request,
                      timeout=180
                  ) as response:
                      with destination.open("wb") as target:
                          while True:
                              chunk = response.read(
                                  1024 * 1024
                              )

                              if not chunk:
                                  break

                              target.write(chunk)
                              sha256.update(chunk)
                              size += len(chunk)

                  actual = sha256.hexdigest()

                  if actual != expected:
                      destination.unlink(
                          missing_ok=True
                      )

                      raise RuntimeError(
                          f"SHA256 mismatch: {filename}"
                      )

                  if (
                      expected_size is not None
                      and size != expected_size
                  ):
                      destination.unlink(
                          missing_ok=True
                      )

                      raise RuntimeError(
                          f"Size mismatch: {filename}"
                      )

                  checksums.append(
                      f"{actual}  {filename}"
                  )

                  manifest.append({
                      "version": version,
                      "filename": filename,
                      "os": item["os"],
                      "arch": item["arch"],
                      "kind": item["kind"],
                      "size": size,
                      "sha256": actual,
                  })

                  print(
                      f"OK: {filename} ({size} bytes)",
                      flush=True
                  )

          (out / "SHA256SUMS").write_text(
              "\n".join(checksums) + "\n",
              encoding="utf-8"
          )

          (out / "manifest.json").write_text(
              json.dumps(
                  manifest,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              f"DONE: {len(selected)} Go releases, "
              f"{len(manifest)} archives",
              flush=True
          )
          PY

      - name: Upload original Go archives
        uses: actions/upload-artifact@v4
        with:
          name: go-toolchains-${{ inputs.start_ver }}-to-${{ inputs.end_ver }}-amd64
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
